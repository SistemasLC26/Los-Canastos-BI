views:
  - name: auditoriaEfectivoView
    title: "Auditoría Efectivo"
    # -------------------------------------------------------------------------
    # NOTA (2026-08): Se eliminaron los campos de detalle por caja individual
    # (estacion, numeroCorte, tipoCorte, horaCorte, cajero) porque el cubo
    # ahora agrega los cortes por fecha+sucursal para evitar el fan-out.
    # Si se necesita detalle por caja, usar el reporte de Diferencia Corte Z.
    # -------------------------------------------------------------------------

    cubes:
      - join_path: auditoriaEfectivo
        includes:
          - fechaCorte
          - sucursal
          - anio
          - mes
          - dia
          - diaSemana
          - nombreMes
          - tipoDiferencia
          - diferenciaSignificativa

          - efectivo
          - tarjeta
          - mixtas
          - pago3
          - ventasTotales
          - tickets

          - ventasReportadasZ
          - totalCorte
          - totalCaja
          - totalItotal
          - totalEntregado
          - ventasCredito
          - clientesAtendidos

          - diferencia
          - diferenciaCorte
          - porcentajeDiferencia

          - ventas0
          - impuesto0
          - ventas8
          - impuesto8
          - ventas16
          - impuesto16

          - devoluciones0
          - devoluciones8
          - impuestoDevoluciones8
          - devoluciones16
          - impuestoDevoluciones16
          - totalDevoluciones

      - join_path: auditoriaEfectivoDetalle
        prefix: true
        includes:
          - estacion
          - numeroCorte
          - tipoCorte
          - horaCorte
          - cajero
          - tipoDiferencia
          - diferenciaSignificativa
          - totalCorte
          - totalCaja
          - totalItotal
          - totalEntregado
          - ventasReportadasZ
          - diferencia
          - diferenciaCorte
          - ventasCredito
          - clientesAtendidos
          - ventas0
          - impuesto0
          - ventas8
          - impuesto8
          - ventas16
          - impuesto16

      - join_path: auditoriaEfectivoDetalle.usuarios
        prefix: true
        includes:
          - nombre
