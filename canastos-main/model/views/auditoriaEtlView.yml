# =============================================================================
# VISTA: auditoriaEtlView
# =============================================================================
# Esta vista expone el cubo "auditoriaEtl" para monitorear la salud del
# pipeline de extracción de datos (ETL) desde las sucursales hacia Athena.
#
# CUBO QUE EXPONE:
#   ← auditoriaEtl  →  log de corridas: proceso, sucursal, tabla, estado y
#                       filas cargadas en cada ejecución
#
# CLAVES PARA INTERPRETAR LOS RESULTADOS:
#   1. Una corrida se considera fallida si estadoConsulta O estadoCarga
#      no es SUCCESS → usar tieneError para filtrar rápido.
#   2. watermark indica hasta qué fecha de datos llegó la corrida; si se
#      estanca para una sucursal, esa sucursal va atrasada en el pipeline.
#   3. filasCargadas en 0 (con estadoCarga = SUCCESS) puede ser normal
#      (sin movimientos ese día) o señal de un problema silencioso —
#      revisar contra el histórico de la misma sucursal/tabla.
#   4. error solo trae contenido cuando tieneError = 'Sí'; en corridas
#      exitosas viene vacío.
#
# Relación con otros cubos:
#   → auditoriaEtl (única fuente; vista de un solo cubo, sin joins)
# =============================================================================

views:
  - name: auditoriaEtlView
    title: "Auditoría ETL"
    description: |
      Monitoreo de corridas del ETL que extrae datos de sucursales a Athena.
      Agregación: FECHA EJECUCIÓN + PROCESO + SUCURSAL + TABLA

      CLAVES PARA INTERPRETAR:
      1. tieneError = 'Sí' si estadoConsulta o estadoCarga no fue SUCCESS
      2. watermark estancado en una sucursal = pipeline atrasado ahí
      3. filasCargadas = 0 no siempre es error; comparar contra histórico
      4. error solo tiene contenido en corridas fallidas

    public: true # Visible en playground y disponible para dashboards

    # -------------------------------------------------------------------------
    # CUBO INCLUIDO
    # Se incluyen todos los campos del cubo; no hay detalle interno que omitir
    # porque la tabla origen ya es un log compacto de auditoría.
    # -------------------------------------------------------------------------
    cubes:
      - join_path: auditoriaEtl
        includes:
          # Dimensiones de tiempo
          - fechaEjecucion
          - anio
          - mes
          - dia
          - nombreMes
          - diaSemana

          # Identificación de la corrida: qué proceso, de dónde, hacia dónde
          - proceso
          - tipoCorrida
          - sucursal
          - tabla

          # Resultado de la corrida
          - estadoConsulta
          - estadoCarga
          - tieneError
          - watermark
          - error

          # Métricas de volumen y salud del pipeline
          - conteo
          - filasCargadas
          - corridasConError
          - corridasExitosas
