# =============================================================================
# VISTA: reporteEfectivo
# =============================================================================
# Vista pública para dashboards de efectivo.
# Expone únicamente los campos necesarios del cubo reporteEfectivo.
# =============================================================================
views:
  - name: reporteEfectivoView
    title: "Reporte de Efectivo"

    cubes:
      - join_path: reporteEfectivo
        includes:
          - fecha
          - sucursal
          - tipoCorte
          - cajero

          # Pagos
          - efectivo
          - tarjeta
          - mixtas
          - pago3

          # Totales de corte
          - ventasTotales
          - tickets
          - totalCorte
          - totalCaja
          - totalItotal
          - ventasCredito
          - clientesAtendidos

          # Ventas por impuesto
          - ventas0
          - impuesto0
          - ventas8
          - impuesto8
          - ventas16
          - impuesto16

          # Devoluciones
          - devoluciones0
          - devoluciones8
          - impuestoDevoluciones8
          - devoluciones16
          - impuestoDevoluciones16
          - totalDevoluciones

          # Diferencias
          - diferenciaCorte
          - tipoDiferencia
