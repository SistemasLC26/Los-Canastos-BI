views:
  - name: auditoriaEfectivo
    title: "3. Auditoría de Efectivo"
    description: "Auditoría del conteo físico de efectivo por corte, cajero y sucursal."

    public: true

    cubes:
      - join_path: cortesDiarios
        includes:
          - fechaCorte
          - sucursal
          - estacion
          - numeroCorte
          - tipoCorte
          - horaCorte
          - cajero
          - cadenaSalida

          - efectivoCaja
          - ventasReportadasZ
          - totalIngresos
          - clientesAtendidos
          - conteoCortes

          - billetes1000
          - billetes500
          - billetes200
          - billetes100
          - billetes50
          - billetes20
          - monedas10
          - monedas5
          - monedas2
          - monedas1

    measures:
      - name: totalConteoFisico
        title: "Total Conteo Físico"
        type: number
        format: currency
        sql: |
          ({cortesDiarios.billetes1000} * 1000)
          + ({cortesDiarios.billetes500} * 500)
          + ({cortesDiarios.billetes200} * 200)
          + ({cortesDiarios.billetes100} * 100)
          + ({cortesDiarios.billetes50} * 50)
          + ({cortesDiarios.billetes20} * 20)
          + ({cortesDiarios.monedas10} * 10)
          + ({cortesDiarios.monedas5} * 5)
          + ({cortesDiarios.monedas2} * 2)
          + ({cortesDiarios.monedas1} * 1)

      - name: diferenciaConteoVsCaja
        title: "Diferencia Conteo vs Caja"
        type: number
        format: currency
        sql: |
          (
            ({cortesDiarios.billetes1000} * 1000)
            + ({cortesDiarios.billetes500} * 500)
            + ({cortesDiarios.billetes200} * 200)
            + ({cortesDiarios.billetes100} * 100)
            + ({cortesDiarios.billetes50} * 50)
            + ({cortesDiarios.billetes20} * 20)
            + ({cortesDiarios.monedas10} * 10)
            + ({cortesDiarios.monedas5} * 5)
            + ({cortesDiarios.monedas2} * 2)
            + ({cortesDiarios.monedas1} * 1)
          ) - {cortesDiarios.efectivoCaja}
