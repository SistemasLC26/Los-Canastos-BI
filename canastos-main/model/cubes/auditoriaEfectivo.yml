cubes:
  - name: auditoriaEfectivo

    sql: |
      WITH ventas_pago AS (
          SELECT
              CAST(SUBSTR(v.usufecha, 1, 10) AS DATE) AS fecha,
              v.sucursal,

              SUM(CASE WHEN v.pago1 > 0 AND v.pago2 = 0 THEN v.importe + v.impuesto ELSE 0 END) AS efectivo,
              SUM(CASE WHEN v.pago2 > 0 AND v.pago1 = 0 THEN v.importe + v.impuesto ELSE 0 END) AS tarjeta,
              SUM(CASE WHEN v.pago1 > 0 AND v.pago2 > 0 THEN v.importe + v.impuesto ELSE 0 END) AS mixtas,
              SUM(CASE WHEN v.pago3 > 0 THEN v.importe + v.impuesto ELSE 0 END) AS pago3,
              SUM(v.importe + v.impuesto) AS ventas_totales,
              COUNT(*) AS tickets
          FROM canastos_tfx.tfx_table_ventas v
          WHERE v.estado IN ('CO','CA')
            AND regexp_like(v.usufecha, '^20[0-9]{2}-')
          GROUP BY
              CAST(SUBSTR(v.usufecha, 1, 10) AS DATE),
              v.sucursal
      ),

      cortes AS (
          SELECT
              CAST(SUBSTR(cx.usufecha, 1, 10) AS DATE) AS fecha,
              cx.sucursal,
              cx.estacion,
              cx.corte AS numero_corte,
              cx.corte AS tipo_corte,
              cx.cajero,

              SUM(cx.totalventas) AS ventas_reportadas_z,
              SUM(cx.totalventas) AS total_corte,
              SUM(cx.totalcaja) AS total_caja,
              SUM(cx.itotal) AS total_itotal,
              SUM(cx.ventascredito) AS ventas_credito,
              SUM(cx.clientesatendidos) AS clientes_atendidos,

              SUM(cx.ventasimpuesto15) AS ventas0,
              SUM(cx.impuesto15) AS impuesto0,

              SUM(
                  (
                      cx.totalventas -
                      (
                          cx.impuesto15 +
                          cx.impuesto10 +
                          cx.ventasimpuesto10 +
                          cx.ventasimpuesto15
                      )
                  ) / 1.08
              ) AS ventas8,

              SUM(
                  (
                      (
                          cx.totalventas -
                          (
                              cx.impuesto15 +
                              cx.impuesto10 +
                              cx.ventasimpuesto10 +
                              cx.ventasimpuesto15
                          )
                      ) / 1.08
                  ) * 0.08
              ) AS impuesto8,

              SUM(cx.ventasimpuesto10) AS ventas16,
              SUM(cx.impuesto10) AS impuesto16,

              SUM(
                  CASE
                      WHEN cx.totalcaja - cx.itotal > 0 THEN -(cx.totalcaja - cx.itotal)
                      WHEN cx.totalcaja - cx.itotal < 0 THEN ABS(cx.totalcaja - cx.itotal)
                      ELSE 0
                  END
              ) AS diferencia_corte

          FROM canastos_tfx.tfx_table_corteszx cx
          WHERE regexp_like(cx.usufecha, '^20[0-9]{2}-')
          GROUP BY
              CAST(SUBSTR(cx.usufecha, 1, 10) AS DATE),
              cx.sucursal,
              cx.estacion,
              cx.corte,
              cx.cajero
      ),

      devoluciones AS (
          SELECT
              CAST(SUBSTR(v.usufecha, 1, 10) AS DATE) AS fecha,
              v.sucursal,

              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') AND p.impuesto = 0 THEN ABS(p.cantidad) * p.precio * (1 - (p.descuento / 100.0)) ELSE 0 END) AS devoluciones0,
              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') AND p.impuesto = 8 THEN ABS(p.cantidad) * p.precio * (1 - (p.descuento / 100.0)) ELSE 0 END) AS devoluciones8,
              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') AND p.impuesto = 8 THEN ABS(p.cantidad) * p.precio * (1 - (p.descuento / 100.0)) * 0.08 ELSE 0 END) AS impuesto_devoluciones8,
              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') AND p.impuesto = 16 THEN ABS(p.cantidad) * p.precio * (1 - (p.descuento / 100.0)) ELSE 0 END) AS devoluciones16,
              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') AND p.impuesto = 16 THEN ABS(p.cantidad) * p.precio * (1 - (p.descuento / 100.0)) * 0.16 ELSE 0 END) AS impuesto_devoluciones16,
              SUM(CASE WHEN v.tipo_doc IN ('DEV','DV') THEN v.importe + v.impuesto ELSE 0 END) AS total_devoluciones

          FROM canastos_tfx.tfx_table_ventas v
          INNER JOIN canastos_tfx.tfx_table_partvta p
              ON v.venta = p.venta
             AND v.sucursal = p.sucursal
          WHERE v.estado IN ('CO','CA')
            AND regexp_like(v.usufecha, '^20[0-9]{2}-')
          GROUP BY
              CAST(SUBSTR(v.usufecha, 1, 10) AS DATE),
              v.sucursal
      )

      SELECT
          COALESCE(c.fecha, v.fecha, d.fecha) AS fecha,
          COALESCE(c.sucursal, v.sucursal, d.sucursal) AS sucursal,

          c.estacion,
          c.numero_corte,
          c.tipo_corte,
          c.cajero,

          COALESCE(v.efectivo, 0) AS efectivo,
          COALESCE(v.tarjeta, 0) AS tarjeta,
          COALESCE(v.mixtas, 0) AS mixtas,
          COALESCE(v.pago3, 0) AS pago3,

          COALESCE(v.ventas_totales, 0) AS ventas_totales,
          COALESCE(v.tickets, 0) AS tickets,

          COALESCE(c.ventas_reportadas_z, 0) AS ventas_reportadas_z,
          COALESCE(c.total_corte, 0) AS total_corte,
          COALESCE(c.total_caja, 0) AS total_caja,
          COALESCE(c.total_itotal, 0) AS total_itotal,
          COALESCE(c.ventas_credito, 0) AS ventas_credito,
          COALESCE(c.clientes_atendidos, 0) AS clientes_atendidos,

          COALESCE(c.ventas0, 0) AS ventas0,
          COALESCE(c.impuesto0, 0) AS impuesto0,
          COALESCE(c.ventas8, 0) AS ventas8,
          COALESCE(c.impuesto8, 0) AS impuesto8,
          COALESCE(c.ventas16, 0) AS ventas16,
          COALESCE(c.impuesto16, 0) AS impuesto16,

          COALESCE(d.devoluciones0, 0) AS devoluciones0,
          COALESCE(d.devoluciones8, 0) AS devoluciones8,
          COALESCE(d.impuesto_devoluciones8, 0) AS impuesto_devoluciones8,
          COALESCE(d.devoluciones16, 0) AS devoluciones16,
          COALESCE(d.impuesto_devoluciones16, 0) AS impuesto_devoluciones16,
          COALESCE(d.total_devoluciones, 0) AS total_devoluciones,

          COALESCE(c.diferencia_corte, 0) AS diferencia_corte,

          CASE
              WHEN COALESCE(c.diferencia_corte, 0) = 0 THEN 'SIN DIF'
              WHEN COALESCE(c.diferencia_corte, 0) < 0 THEN 'FALTANTE'
              ELSE 'SOBRANTE'
          END AS tipo_diferencia,

          CASE
              WHEN ABS(COALESCE(c.diferencia_corte, 0)) >= 50 THEN 'Sí'
              ELSE 'No'
          END AS diferencia_significativa

      FROM cortes c
      FULL OUTER JOIN ventas_pago v
          ON c.fecha = v.fecha
         AND c.sucursal = v.sucursal
      FULL OUTER JOIN devoluciones d
          ON COALESCE(c.fecha, v.fecha) = d.fecha
         AND COALESCE(c.sucursal, v.sucursal) = d.sucursal

    dimensions:
      - name: fechaCorte
        title: "Fecha Corte"
        sql: fecha
        type: time
            - name: anio
        title: "Año"
        sql: "year(fecha)"
        type: number

      - name: mes
        title: "Mes"
        sql: "month(fecha)"
        type: number

      - name: dia
        title: "Día"
        sql: "day(fecha)"
        type: number

      - name: diaSemana
        title: "Día Semana"
        sql: |
          CASE day_of_week(fecha)
            WHEN 1 THEN 'Lunes'
            WHEN 2 THEN 'Martes'
            WHEN 3 THEN 'Miércoles'
            WHEN 4 THEN 'Jueves'
            WHEN 5 THEN 'Viernes'
            WHEN 6 THEN 'Sábado'
            WHEN 7 THEN 'Domingo'
          END
        type: string

      - name: nombreMes
        title: "Nombre Mes"
        sql: |
          CASE month(fecha)
            WHEN 1 THEN 'Enero'
            WHEN 2 THEN 'Febrero'
            WHEN 3 THEN 'Marzo'
            WHEN 4 THEN 'Abril'
            WHEN 5 THEN 'Mayo'
            WHEN 6 THEN 'Junio'
            WHEN 7 THEN 'Julio'
            WHEN 8 THEN 'Agosto'
            WHEN 9 THEN 'Septiembre'
            WHEN 10 THEN 'Octubre'
            WHEN 11 THEN 'Noviembre'
            WHEN 12 THEN 'Diciembre'
          END
        type: string

      - name: sucursal
        sql: sucursal
        type: string

      - name: estacion
        sql: estacion
        type: string

      - name: numeroCorte
        title: "Número Corte"
        sql: numero_corte
        type: string

      - name: tipoCorte
